name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Run example and print optimized plan
        run: cargo run -- --explain --compare 10
      - name: Generate deterministic synthetic benchmark
        run: python3 scripts/generate_data.py --customers 100 --orders 1000 --seed 42 --output-dir benchdata
      - name: Smoke test release build and benchmark CLI
        run: cargo run --release -- --data-dir benchdata --compare 3 --query "SELECT customers.name, orders.amount FROM customers JOIN orders ON customers.id = orders.customer_id WHERE orders.amount >= 900 AND customers.region = 'US'"
